##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule
# windowrule = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
##############################
### WINDOWS AND WORKSPACES ###
##############################

# Ignore maximize requests globally
windowrule = suppress_event maximize, match:class *

# XWayland drag fix (empty-class popups)
windowrule = match:focus 0, match:class ^$, match:xwayland 1, match:float 1

# ----------------------------
# Zoom menu popup
# ----------------------------

windowrule = match:focus 1, match:class ^zoom$, match:title ^(menu window)$

# ----------------------------
# SwayNC layers (Hyprland 0.53+)
# ----------------------------

# 1. Turn on the blur
layerrule = blur on, match:namespace swaync-control-center
layerrule = blur on, match:namespace swaync-notification-window

# 2. Set the alpha threshold (replaces both ignorezero and ignorealpha)
layerrule = ignore_alpha 0.1, match:namespace swaync-control-center
layerrule = ignore_alpha 0.1, match:namespace swaync-notification-window
